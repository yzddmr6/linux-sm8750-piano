%YAML 1.2
---
$id: http://devicetree.org/schemas/power/supply/southchip,sc96231.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Southchip SC96231 wireless pen transmitter

maintainers:
  - Erwin <yzddmr7@gmail.com>

description: |
  Wireless power transmitter with an I2C control interface. Hall sensors
  detect the magnetic pen attachment; the charging link reports the receiver
  battery level and Bluetooth address. The supply regulator owns voltage
  sequencing. The chip's installed firmware owns the wireless power protocol.

properties:
  compatible:
    const: southchip,sc96231
  reg:
    maxItems: 1
  interrupts:
    maxItems: 1
  vin-supply: true
  enable-gpios:
    maxItems: 1
    description: Transmitter enable signal.
  lp-enable-gpios:
    maxItems: 1
    description: Optional low-power control held asserted during operation.
  hall-gpios:
    items:
      - description: North pole Hall sensor 3
      - description: North pole Hall sensor 4
      - description: South pole Hall sensor 3
      - description: South pole Hall sensor 4
      - description: Pen placement error north pole sensor
      - description: Pen placement error south pole sensor
    description: Active-low magnetic attachment and placement error inputs.
  keyboard-gpios:
    items:
      - description: Keyboard folded over the front of the tablet
      - description: Keyboard folded over the back of the tablet
    description: Active-low keyboard position inputs used to reject its magnets.

required:
  - compatible
  - reg
  - interrupts
  - vin-supply
  - enable-gpios
  - hall-gpios
  - keyboard-gpios

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;
        charger@38 {
            compatible = "southchip,sc96231";
            reg = <0x38>;
            vin-supply = <&pen_boost>;
            enable-gpios = <&tlmm 14 GPIO_ACTIVE_HIGH>;
            lp-enable-gpios = <&tlmm 99 GPIO_ACTIVE_HIGH>;
            hall-gpios = <&tlmm 200 GPIO_ACTIVE_LOW>,
                         <&tlmm 196 GPIO_ACTIVE_LOW>,
                         <&tlmm 201 GPIO_ACTIVE_LOW>,
                         <&tlmm 197 GPIO_ACTIVE_LOW>,
                         <&tlmm 55 GPIO_ACTIVE_LOW>,
                         <&tlmm 59 GPIO_ACTIVE_LOW>;
            keyboard-gpios = <&tlmm 80 GPIO_ACTIVE_LOW>,
                             <&tlmm 11 GPIO_ACTIVE_LOW>;
            interrupt-parent = <&tlmm>;
            interrupts = <78 IRQ_TYPE_EDGE_FALLING>;
        };
    };
