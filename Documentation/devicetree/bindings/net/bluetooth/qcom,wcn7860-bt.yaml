%YAML 1.2
---
$id: http://devicetree.org/schemas/net/bluetooth/qcom,wcn7860-bt.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm WCN7860 Bluetooth

maintainers:
  - Erwin <yzddmr7@gmail.com>

description:
  Bluetooth part of the WCN7860 (GANGES) package, attached over a UART. The
  package PMU (qcom,wcn7860-pmu) powers it; the supplies below are PMU
  outputs, and vddaon-supply associates the device with its power sequencer.

properties:
  compatible:
    enum:
      - qcom,wcn7860-bt

  vddaon-supply:
    description: VDD_AON supply regulator handle

  vddbtcx-supply:
    description: VDD_BTCX supply regulator handle

  vddbtcmx-supply:
    description: VDD_BTCMX supply regulator handle

  vddrfa0p9-supply:
    description: VDD_RFA_0P9 supply regulator handle

  vddrfa1p3-supply:
    description: VDD_RFA_1P3 supply regulator handle

  vddrfa1p9-supply:
    description: VDD_RFA_1P9 supply regulator handle

required:
  - compatible
  - vddaon-supply
  - vddbtcx-supply
  - vddbtcmx-supply
  - vddrfa0p9-supply
  - vddrfa1p3-supply
  - vddrfa1p9-supply

allOf:
  - $ref: bluetooth-controller.yaml#
  - $ref: qcom,bluetooth-common.yaml
  - $ref: /schemas/serial/serial-peripheral-props.yaml#

unevaluatedProperties: false

examples:
  - |
    serial {
        bluetooth {
            compatible = "qcom,wcn7860-bt";

            max-speed = <3200000>;
            vddaon-supply = <&vreg_pmu_aon_0p9>;
            vddbtcx-supply = <&vreg_pmu_btcx_0p9>;
            vddbtcmx-supply = <&vreg_pmu_btcmx_0p9>;
            vddrfa0p9-supply = <&vreg_pmu_rfa_0p9>;
            vddrfa1p3-supply = <&vreg_pmu_rfa_1p3>;
            vddrfa1p9-supply = <&vreg_pmu_rfa_1p9>;
        };
    };
