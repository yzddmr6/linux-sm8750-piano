%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/smartsens,sc820cs.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SmartSens SC820CS 8-megapixel CMOS image sensor

maintainers:
  - Erwin <46088090+yzddmr6@users.noreply.github.com>

description:
  The SC820CS is a RAW image sensor with an I2C control interface
  and a MIPI CSI-2 output. The supported configuration uses four D-PHY
  data lanes and a 24 MHz input clock.

allOf:
  - $ref: /schemas/media/video-interface-devices.yaml#

properties:
  compatible:
    const: smartsens,sc820cs

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  avdd-supply:
    description: Analogue supply, 2.8 V.

  dvdd-supply:
    description: Digital core supply, 1.2 V.

  dovdd-supply:
    description: Digital I/O supply, 1.8 V.

  reset-gpios:
    description: Active-low reset signal.
    maxItems: 1

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    additionalProperties: false
    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false
        properties:
          data-lanes:
            items:
              - const: 1
              - const: 2
              - const: 3
              - const: 4
          link-frequencies:
            maxItems: 1
        required:
          - data-lanes
          - link-frequencies

required:
  - compatible
  - reg
  - clocks
  - avdd-supply
  - dvdd-supply
  - dovdd-supply
  - reset-gpios
  - port

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        camera@20 {
            compatible = "smartsens,sc820cs";
            reg = <0x20>;
            clocks = <&camera_clk>;
            assigned-clocks = <&camera_clk>;
            assigned-clock-rates = <24000000>;
            avdd-supply = <&camera_avdd>;
            dvdd-supply = <&camera_dvdd>;
            dovdd-supply = <&camera_dovdd>;
            reset-gpios = <&gpio 7 GPIO_ACTIVE_LOW>;
            port {
                endpoint {
                    remote-endpoint = <&csi_in>;
                    data-lanes = <1 2 3 4>;
                    link-frequencies = /bits/ 64 <368000000>;
                };
            };
        };
    };
