%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/ovti,ov32d40.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: OmniVision OV32D40 image sensor

maintainers:
  - yzddmr6 <46088090+yzddmr6@users.noreply.github.com>

description:
  The OV32D40 is a 32 megapixel sensor controlled over I2C with a four-lane
  MIPI CSI-2 output. The supported mode uses a 19.2 MHz external clock.

allOf:
  - $ref: /schemas/media/video-interface-devices.yaml#

properties:
  compatible:
    const: ovti,ov32d40

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  power-domains:
    maxItems: 1
    description: Power domain required for the sensor master clock.

  reset-gpios:
    maxItems: 1
    description: Active low sensor reset.

  avdd-supply:
    description: Analog supply, 2.8 V.

  dvdd-supply:
    description: Digital core supply, 1.2 V.

  vddio-supply:
    description: Digital I/O supply, 1.8 V.

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    additionalProperties: false

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          data-lanes:
            items:
              - const: 1
              - const: 2
              - const: 3
              - const: 4

          link-frequencies:
            maxItems: 1

        required:
          - data-lanes
          - link-frequencies

required:
  - compatible
  - reg
  - clocks
  - reset-gpios
  - avdd-supply
  - dvdd-supply
  - vddio-supply
  - port

unevaluatedProperties: false
