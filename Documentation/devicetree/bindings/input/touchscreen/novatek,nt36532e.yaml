%YAML 1.2
---
$id: http://devicetree.org/schemas/input/touchscreen/novatek,nt36532e.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Novatek NT36532E host-processed touch controller

maintainers:
  - Erwin <yzddmr7@gmail.com>

description:
  SPI controller with host-downloaded RAM firmware and raw sensor frames.
  The initial driver supports the cascade variant only. Touch power is shared
  with the panel. The panel phandle orders capture and firmware reload around
  the shared TDDI reset and power sequence.

allOf:
  - $ref: touchscreen.yaml#
  - $ref: /schemas/spi/spi-peripheral-props.yaml#

properties:
  compatible:
    const: novatek,nt36532e

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  spi-max-frequency:
    maximum: 19200000

  spi-cpol: false
  spi-cpha: false

  firmware-name:
    minItems: 1
    maxItems: 2
    description:
      Board and panel-specific normal application firmware. With
      novatek,lcd-id-gpios the entry at the index of the ID level is used.

  novatek,lcd-id-gpios:
    maxItems: 1
    description:
      Input reading the panel module ID strap, low for the CSOT module and
      high for the BOE module on the Xiaomi Pad 8 Pro. It selects the
      firmware-name entry for the module.

required:
  - compatible
  - reg
  - interrupts
  - spi-max-frequency
  - firmware-name

if:
  properties:
    firmware-name:
      minItems: 2
then:
  required:
    - novatek,lcd-id-gpios

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    spi {
        #address-cells = <1>;
        #size-cells = <0>;

        touchscreen@0 {
            compatible = "novatek,nt36532e";
            reg = <0>;
            spi-max-frequency = <19200000>;
            interrupt-parent = <&tlmm>;
            interrupts = <162 IRQ_TYPE_EDGE_RISING>;
            novatek,lcd-id-gpios = <&tlmm 100 GPIO_ACTIVE_HIGH>;
            firmware-name = "novatek/piano/novatek_nt36532_piano_fw_csot.bin",
                            "novatek/piano/novatek_nt36532_piano_fw_boe.bin";
        };
    };
