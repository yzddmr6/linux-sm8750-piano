%YAML 1.2
---
$id: http://devicetree.org/schemas/input/nanosic,wn8030.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Nanosic WN8030 detachable keyboard bridge

maintainers:
  - Erwin <yzddmr7@gmail.com>

description:
  An I2C bridge on the tablet connects a detachable keyboard folio. Its
  application is loaded into RAM before it supplies privately framed HID
  reports. This is not a standard HID-over-I2C device.

properties:
  compatible:
    const: xiaomi,piano-keyboard

  reg:
    const: 0x4c

  interrupts:
    minItems: 2
    maxItems: 2

  interrupt-names:
    items:
      - const: irq
      - const: wakeup

  reset-gpios:
    maxItems: 1
    description: Active-low bridge reset.

  wake-gpios:
    maxItems: 1
    description: Driven high to keep the bridge awake, low to allow sleep.

  vdd-supply:
    description: Nominal 3.3 V bridge supply.

  dvdd-supply:
    description: Nominal 1.8 V bridge supply.

  firmware-name:
    maxItems: 1
    description: Application firmware for this board, including its NANO IC header.

  wakeup-source: true

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names
  - reset-gpios
  - wake-gpios
  - vdd-supply
  - dvdd-supply

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        keyboard@4c {
            compatible = "xiaomi,piano-keyboard";
            reg = <0x4c>;
            interrupt-parent = <&tlmm>;
            interrupts = <97 IRQ_TYPE_EDGE_RISING>, <95 IRQ_TYPE_EDGE_RISING>;
            interrupt-names = "irq", "wakeup";
            reset-gpios = <&tlmm 188 GPIO_ACTIVE_LOW>;
            wake-gpios = <&tlmm 3 GPIO_ACTIVE_HIGH>;
            vdd-supply = <&keyboard_vdd>;
            dvdd-supply = <&keyboard_dvdd>;
            firmware-name = "nanosic/piano/MCU_Upgrade.bin";
        };
    };
